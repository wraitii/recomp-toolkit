[package]
name = "d3d8-wgpu"
version = "0.0.0"
edition = "2024"
publish = false
description = "Reusable D3D7/8/9 renderer and recomp-kit graphics adapters on wgpu"
license = "MIT OR Apache-2.0"

[features]
default = ["windowing", "probe"]
windowing = ["dep:winit"]
probe = ["dep:env_logger"]

[lib]
name = "d3d8_wgpu"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "probe-headless"
path = "src/bin/probe_headless.rs"
required-features = ["probe"]

[[bin]]
name = "probe-windowed"
path = "src/bin/probe_windowed.rs"
required-features = ["probe", "windowing"]

[[bin]]
name = "shader-corpus"
path = "src/bin/shader_corpus.rs"

[[test]]
name = "probe_report"
path = "tests/probe_report.rs"
required-features = ["probe"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
bcdec_rs = "0.2"
ddsfile = "0.5"
env_logger = { version = "0.11", optional = true }
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "pnm"] }
log = "0.4"
pollster.workspace = true
raw-window-handle = "0.6"
recomp-gpu = { path = "../gpu" }
recomp-compositor = { path = "../compositor", default-features = false, features = ["gpu"] }
smallvec = { version = "1", features = ["union"] }
texpresso = "2"
wgpu.workspace = true
winit = { version = "0.30", optional = true }
naga = { workspace = true, features = ["wgsl-in"] }

[build-dependencies]
cxx-build = "=1.0.171"
naga = { workspace = true, features = ["wgsl-in", "msl-out", "termcolor", "stderr"] }

[dependencies.cxx]
version = "=1.0.171"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
block2 = "0.6"
